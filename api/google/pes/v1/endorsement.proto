syntax = "proto3";

package google.pes.v1;

import "google/api/field_behavior.proto";
import "google/pes/v1/verification_material.proto";

option java_multiple_files = true;
option java_outer_classname = "EndorsementProto";
option java_package = "com.google.pes.v1";

// Represents a publicly verifiable endorsement of an artifact statement,
// countersigned by the Public Endorsement Service (PES).
message PublicEndorsement {
  // Unique name of the endorsement created by the service
  // Format: endorsements/{endorsement}
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];

  // Object representing In-toto statement describing artifacts
  Statement statement = 2 [(google.api.field_behavior) = REQUIRED];

  // The signature over `statement.serialized` generated by the **Publisher** (e.g., a software builder or vendor).
  // It is used to verify the integrity of the statement and bind the publisher's key material to the artifact.
  Signature statement_signature = 3 [(google.api.field_behavior) = REQUIRED];

  // One or more signatures generated by the **Endorser** (the Public Endorsement Service).
  // These signatures are generated over:
  // PAE(statement.serialized, statement_signature, tlog_receipt.entry_id)
  // They certify that PES has validated the publisher's signature and recorded the entry in the Transparency Log.
  //
  // The PAE is calculated as follows:
  // PAE(`statement.serialized`, `statement_signature`, `entry_id`) =
  //   "PES" + ENCODE(`statement.serialized`) +
  //   ENCODE(`statement_signature.verification_material`) +
  //   ENCODE(`statement_signature.signature`) +
  //   ENCODE(`entry_id`)
  //
  // Where:
  // +            -> concatenation
  // SP           -> ASCII space [0x20]
  // "PES"        -> ASCII [0x50, 0x45, 0x53]
  // LEN(obj)     -> ASCII decimal byte size of the obj
  // ENCODE(obj)  -> SP + LEN(obj) + SP + obj
  repeated Signature endorsement_signatures = 5 [(google.api.field_behavior) = OUTPUT_ONLY];

  // Represents value returned by the TLog for client to verify if needed
  TLogReceipt tlog_receipt = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents in-toto statement of v1 schema. Only https://in-toto.io/Statement/v1 is supported
message Statement {
  enum Format {
    // Undefined and hence invalid format of the statement.
    FORMAT_UNSPECIFIED = 0;

    // JSON v1 in-toto statement.
    JSON_INTOTO = 1;
  }

  // Format of the serialized statement.
  Format format = 1 [(google.api.field_behavior) = REQUIRED];

  // Serialized statement in a given format
  bytes serialized = 2 [(google.api.field_behavior) = REQUIRED];
}

// A wrapper for a single signature of byte data
message Signature {
  // An actual raw signature
  bytes signature = 1 [(google.api.field_behavior) = REQUIRED];

  // The material required to verify the authenticity of the signature.
  VerificationMaterial verification_material = 2 [(google.api.field_behavior) = REQUIRED];

  // RFC 3161 timestamp token from the timestamp authority certifying the signature creation time.
  repeated TimeStampToken time_stamp_token = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// Represents an RFC 3161 TimeStampToken.
message TimeStampToken {
  // Contains DER-encoded TimeStampToken as defined in https://www.rfc-editor.org/info/rfc3161/#section-2.4.2
  bytes der_bytes = 1 [(google.api.field_behavior) = REQUIRED];
}

// Represents a receipt from the TLog.
message TLogReceipt {
  // The unique identifier for the log entry returned by TLog.
  string entry_id = 1 [(google.api.field_behavior) = REQUIRED];
}
